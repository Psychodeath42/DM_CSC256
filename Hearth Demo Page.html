<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Page</title>
    <link rel="stylesheet" href="./index_style_sheet.css"></link>
    <script src="./library_of_alexandria.js" defer></script>
</head>
<body>
    <header>

        <h1>Hearth's Demo Page</h1>
        <h2>A place for silly stuff and testing code</h2>

    </header>
    <main>
<!-- this article is for containing the meme drop down menu-->
        <article class="meme_player">

        <h3>Select a Video</h3>
         <select id="video_selector" class="meme_menu">
           <option disabled selected>Select a video</option>
          </select>

          <br><br>

         <video class="meme_video" id="video_player" width="640" onloadstart="this.volume=0.75" autoplay controls style="display: none;">
           <source src="">
           Your browser does not support the video tag.
         </video>

        </article>
<!--this article is for demonstrating how to inject text using javascript -->
        <article class="javascript_section">

            <h3 id="h3_header_1"></h3>
            <p class="confinement" id="para_1"></p>
            <h4 id="h4_subheader_1"></h4>
            <p class="confinement" id="para_2"></p>

        </article>

        <br> <br> <br> 
<!-- this section is for containing the form element-->
        <section class="form">

            <form action="#" onsubmit="return false;">
                <input type="text" placeholder="Your Name" id="txt_name" name="txt_name" required><br>
                <input type="number" placeholder="Your Phone Number" id="phn_number" name="phn_number" required><br>
                <select required id="list" name="list">
                    <option selected>Pick a Thing</option>
                    <option>Thing1</option>
                    <option>Thing2</option>
                    <option>Thing3</option>
                </select><br>
                <button type="submit">Submit</button><br>
            </form>

         </section>

         <br> <br> <br>
<!-- This section is for containing the slideshow-->
         <section class="slides">

         <img id="img_slide" src="" alt="Slide show of different images"> <br>
         <button onclick="previous_slide();">Previous</button>
         <button onclick="next_slide();">Next</button>

         </section>

         <br> <br> <br>
<!-- this section is for containing the array implement -->
         <section class="user_array_section">

            <h3 id="h3_header_array"></h3>

            <label class="title_label" for="user_game_title">Enter Game Title:</label><br>

            <input type="text" id="user_game_title" name="user_game_title" placeholder="Game Name" required><br>

            <button type="submit" onclick="add_title();">Add a Game</button>

            <div>

                <button onclick="reset_titles();">Reset Titles</button>

            </div>

            <div class="game_titles_css" id="titles_display"></div>
         </section>
<!-- this section is for the technical form -->
        <section class="game_section">
            <h3 id="h3_game_title"></h3>
            <form id="form_player" name="form_player">
                <label class="game_labels" for="text_player_nm">Choose Your Name</label>
                <input type="text" id="txt_player_nm" name="txt_player_nm"><br>

                <label class="game_labels" for="text_player_lvl">Choose Your Difficulty</label>
                <input type="number" id="num_player_lvl" name="num_player_lvl"><br>

                <label class="game_labels" for="text_player_stat">Choose Your Stats</label>
                <input type="number" id="num_player_stat" name="num_player_stat"><br>

                <label class="game_labels" for="text_player_desc">Write Your Catchphrase</label>
                <input type="text" id="txt_player_desc" name="txt_player_desc"><br>
            
                <button type="button" onclick="generate_form();">Submit Character</button><br>
            </form>

            <h2 id="player_info" style="display: none;">Player Information</h2>
            <div id="div_output" class="game_labels"></div>

        </section>
    </main>

    
    <footer>

        <h5>This webspace made by magic and procrastination induced crunch time.</h5>

    </footer>
</body>
</html>
